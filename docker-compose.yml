services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: delivery-health-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: delivery_health
      POSTGRES_PASSWORD: delivery_health
      POSTGRES_DB: delivery_health
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
